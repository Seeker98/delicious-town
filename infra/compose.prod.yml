name: dt
x-server: &server
  image: dt-server:latest
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dt
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dt -d dt']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *server
    build: { context: .., dockerfile: apps/server/Dockerfile }
    command: ['node', 'dist/cli/migrate.js']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *server
    deploy: { replicas: 2 }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      # 写 127.0.0.1 不写 localhost：容器里 localhost 先解析成 ::1，api 只听 IPv4，wget 连不上也不换地址
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/readyz']
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    <<: *server
    command: ['node', 'dist/worker.js']
    # 一个就够（用户 2026-10-08 定）：两个时只有主节点跑任务，另一个只占内存（服务器 1 GB，交换区已用 300 多 MB）；
    # 挂了 Docker 会自动重启，周期任务按 job_run 抢占，不会重复也不会漏太多
    deploy: { replicas: 1 }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
