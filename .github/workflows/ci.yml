name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 镜像从 Google 的 Docker Hub 镜像站 mirror.gcr.io 拉，内容和 Docker Hub 官方镜像一样：
    # 2026-10-10 GitHub 的机器先是用完了 Docker Hub 的匿名额度，登录以后又连不上 auth.docker.io（超时），CI 一直挂
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: dt
          POSTGRES_PASSWORD: dt
          POSTGRES_DB: dt_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U dt -d dt_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dt/config build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  # 服务端镜像（问题记录 382）：PR 只构建；main 上构建后推到 GHCR，部署时服务器直接拉，
  # 不在服务器上构建（服务器只有 1 GB 内存，构建会把数据库挤进交换区）。标签 = 提交号
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      # buildkit 自己的镜像也从 mirror.gcr.io 拉（默认是 Docker Hub 的 moby/buildkit）
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ghcr.io/seeker98/delicious-town-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
