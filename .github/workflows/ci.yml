name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 服务容器从 Docker Hub 拉：登录后按账号的额度算，不再和别人共用 GitHub 机器的匿名额度（2026-10-10 匿名额度用完，CI 挂了）。
    # DOCKERHUB_TOKEN 是只读公开仓库的个人访问令牌
    services:
      postgres:
        image: postgres:16-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: dt
          POSTGRES_PASSWORD: dt
          POSTGRES_DB: dt_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U dt -d dt_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dt/config build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  # 服务端镜像（问题记录 382）：PR 只构建；main 上构建后推到 GHCR，部署时服务器直接拉，
  # 不在服务器上构建（服务器只有 1 GB 内存，构建会把数据库挤进交换区）。标签 = 提交号
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      # 先登录 Docker Hub 再起 buildx：buildkit 镜像（moby/buildkit）和 Dockerfile 里的 node:22-alpine 都从 Docker Hub 拉
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ghcr.io/seeker98/delicious-town-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
